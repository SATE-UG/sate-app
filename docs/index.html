<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>SATE</title>
  <meta name="description" content="SATE-Team-App">
  <!-- Immer dunkel wie die SATE-Slides: schwarz, weiß, Courier New -->
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- iOS: als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SATE">
  <!-- Statusleiste durchsichtig über Schwarz; die Abstände dafür macht style.css (safe-area-inset) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="seite">
    <header class="kopf">
      <img class="logo" src="bilder/logo.png" alt="SATE" width="174" height="40">
    </header>

    <!-- Anmeldung -->
    <section id="anmelden" hidden>
      <h1 class="titel"><strong>SATE</strong> Team</h1>
      <p class="untertitel">Anmelden</p>
      <form id="code-form" novalidate>
        <label for="code">Dein Zugangscode</label>
        <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off"
               autocorrect="off" spellcheck="false" maxlength="24" placeholder="ABCD-EFGH-JKMN" enterkeyhint="go">
        <p class="hinweis">Den Code bekommst du von Mark. Er bleibt auf diesem Gerät gespeichert.</p>
        <button id="code-senden" type="submit" class="knopf haupt">Anmelden <img class="pfeil" src="bilder/pfeil.png" alt="" width="17" height="20"></button>
      </form>
    </section>

    <!-- Übersicht -->
    <section id="uebersicht" hidden>
      <h1 class="titel"><strong>Hallo</strong> <span id="name"></span></h1>
      <p class="untertitel">Stand: <span id="zeit">–</span></p>
      <!-- Flasche als Aufzählungszeichen kommt aus style.css (.zahl::before) -->
      <dl class="zahlen">
        <div class="zahl">
          <dt>Bestand</dt>
          <dd><span id="bestand">–</span> <span class="einheit">Flaschen</span></dd>
        </div>
        <div class="zahl">
          <dt>Reichweite</dt>
          <dd><span id="reichweite">–</span> <span class="einheit">Monate</span></dd>
        </div>
      </dl>
      <div class="knoepfe">
        <button id="neu-laden" type="button" class="knopf haupt">Neu laden</button>
        <button id="abmelden" type="button" class="knopf">Abmelden</button>
      </div>
    </section>

    <p id="laden" class="status" role="status" aria-live="polite" hidden>Lädt …</p>
    <p id="fehler" class="fehler" role="alert" hidden></p>

    <footer class="fuss">Trink SATE!<img class="herz" src="bilder/herz.png" alt="" width="24" height="24"></footer>
  </main>

  <script src="config.js"></script>
  <script src="hilfen.js"></script>
  <script src="app.js"></script>
</body>
</html>
